name: subq
# Lean spec used by `make setup`. manim-voiceover is intentionally NOT here:
# its TTS deps explode the conda solve and hang it for 20+ minutes. Install
# after the env exists if you need VO automation: `pip install manim-voiceover`.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - manim     # pulls numpy, pycairo, manimpango, cairo, pango transitively
  - ffmpeg
  - pip
  - pip:
      - openai
      - python-dotenv
      - tiktoken
      - typer>=0.12.0
      - rich>=13.7.0
